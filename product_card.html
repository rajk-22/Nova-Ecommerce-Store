<article class="product-card">
 <a class="product-image" href="{% url 'product_detail' product.slug %}">
  {% if product.image_url %}<img src="{{ product.image_url }}" alt="{{ product.name }}">{% else %}<div class="image-placeholder">NOVA</div>{% endif %}
  {% if product.featured %}<span class="tag">FEATURED</span>{% endif %}
 </a>
 <div class="product-meta"><span>{{ product.category.name }}</span><span>₹{{ product.price }}</span></div>
 <h3><a href="{% url 'product_detail' product.slug %}">{{ product.name }}</a></h3>
 <p class="stock-note">{% if product.stock %}In stock{% else %}Currently unavailable{% endif %}</p>
</article>
